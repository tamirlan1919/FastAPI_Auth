global:
  scrape_interval: 5s       # для учебного проекта часто; в проде обычно 15–30s
  evaluation_interval: 5s

scrape_configs:
  # FastAPI-приложение: метрики от prometheus-fastapi-instrumentator на GET /metrics
  - job_name: auth-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  # Celery через Flower (celery -A app.tasks.celery_app flower) — у него свой /metrics
  - job_name: celery-flower
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5555"]

  # Сам Prometheus
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
