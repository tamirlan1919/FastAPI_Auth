services:
  api:
    build: &app-build
      context: .
      dockerfile: app/Dockerfile
    env_file: .env
    environment: &app-env
      DATABASE_URL: sqlite+aiosqlite:////data/db.sqlite3
      MONGO_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
      RABBIT_URL: amqp://app:app@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes: &app-volumes
      - sqlite-data:/data
      - ./reports:/code/reports
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  celery-worker:
    build: *app-build
    env_file: .env
    environment: *app-env
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=info
    volumes: *app-volumes
    depends_on:
      api:
        condition: service_healthy

  celery-beat:
    build: *app-build
    env_file: .env
    environment: *app-env
    command: celery -A app.tasks.celery_app:celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    depends_on:
      api:
        condition: service_healthy

  email-worker:
    build: *app-build
    env_file: .env
    environment: *app-env
    command: python -m app.workers.email_worker
    depends_on:
      rabbitmq:
        condition: service_healthy

  mongo:
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sqlite-data:
  mongo-data:
  redis-data:
  rabbitmq-data:

